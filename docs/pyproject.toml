[project]
name = "docs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Charles Bouchard-Légaré", email = "charlesbouchardlegare@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.21.0",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.13.4",
    "sphinx-copybutton>=0.5.2",
    "sphinx-paramlinks>=0.6.0",
    "sphinx-pydata-theme>=0.1.0",
    "sphinx-tabs>=3.5.0",
]

[project.scripts]
docs = "docs:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
